<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Biofeedback Binaural</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f1e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1a1f2f;
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a2f3f;
        }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-top: 0;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff66;
        }
        .button {
            background: #00d4ff;
            border: none;
            color: #0a0f1e;
            font-size: 2em;
            font-weight: bold;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 30px auto;
            display: block;
            cursor: pointer;
            box-shadow: 0 10px 20px #00d4ff66;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 4px solid #ffffff88;
        }
        .button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px #00d4ff66;
        }
        .timer {
            font-size: 4em;
            font-family: monospace;
            text-align: center;
            margin: 20px 0;
            color: #00d4ff;
            text-shadow: 0 0 15px #00d4ff;
        }
        .status {
            text-align: center;
            font-size: 1.2em;
            margin: 15px 0;
            color: #aaa;
        }
        .indicators {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .indicator {
            background: #0f1424;
            border-radius: 20px;
            padding: 15px;
            min-width: 120px;
            margin: 5px;
            text-align: center;
            border-left: 4px solid #00d4ff;
        }
        .indicator .label {
            font-size: 0.9em;
            color: #aaa;
            text-transform: uppercase;
        }
        .indicator .value {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
        }
        .export-btn {
            background: #2a2f3f;
            border: 1px solid #00d4ff;
            color: #00d4ff;
            font-size: 1.2em;
            padding: 15px 25px;
            border-radius: 50px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        .export-btn:active {
            background: #00d4ff22;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 0.8em;
        }
        @media (max-width: 400px) {
            .button {
                width: 150px;
                height: 150px;
                font-size: 1.5em;
            }
            .timer {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Binaural Bio</h1>

        <div id="playPauseBtn" class="button">▶</div>

        <div class="timer" id="timer">00:00</div>
        <div class="status" id="status">Esperando inicio</div>

        <div class="indicators">
            <div class="indicator">
                <div class="label">Latidos</div>
                <div class="value" id="bpm">--</div>
            </div>
            <div class="indicator">
                <div class="label">Respiración</div>
                <div class="value" id="rpm">--</div>
            </div>
            <div class="indicator">
                <div class="label">Binaural</div>
                <div class="value" id="binaural">--</div>
            </div>
        </div>

        <button class="export-btn" id="exportBtn">📥 Exportar CSV</button>
        <div class="footer">Coloca el teléfono sobre el pecho (pantalla arriba)</div>
    </div>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const SAMPLE_RATE = 100; // Hz (aproximado, depende del dispositivo)
        const MIN_BEAT_INTERVAL = 300; // ms (200 bpm máximo)
        const BREATH_ALPHA = 0.05; // filtro para respiración
        const HEART_ALPHA = 0.8;   // filtro pasa altos para latidos

        // ==================== VARIABLES GLOBALES ====================
        let isPlaying = false;
        let sessionStartTime = null;
        let timerInterval = null;
        let lastAccelZ = null;
        let prevFilteredZ = 0;
        let prevHeartZ = 0;

        // Buffers para detección
        const heartBuffer = [];
        const HEART_BUFFER_SIZE = 200; // 2 segundos a 100 Hz
        let lastBeatTime = 0;
        const beatIntervals = [];

        // Respiración
        let breathFiltered = 0;
        let lastBreathPeak = 0;
        let rpm = 0;

        // Datos para CSV
        let csvData = [];
        const csvHeaders = ['timestamp', 'heartRateBPM', 'rpm', 'binauralFreq', 'accelZ'];

        // Audio
        let audioCtx = null;
        let oscillatorLeft = null;
        let oscillatorRight = null;
        let gainNode = null;
        let binauralFreq = 5; // Hz inicial

        // Elementos DOM
        const playPauseBtn = document.getElementById('playPauseBtn');
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('status');
        const bpmEl = document.getElementById('bpm');
        const rpmEl = document.getElementById('rpm');
        const binauralEl = document.getElementById('binaural');
        const exportBtn = document.getElementById('exportBtn');

        // ==================== FUNCIONES DE AUDIO ====================
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.1; // volumen suave
            gainNode.connect(audioCtx.destination);
        }

        function startBinaural(freq) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (oscillatorLeft) oscillatorLeft.stop();
            if (oscillatorRight) oscillatorRight.stop();

            const now = audioCtx.currentTime;

            oscillatorLeft = audioCtx.createOscillator();
            oscillatorLeft.type = 'sine';
            oscillatorLeft.frequency.value = 200; // frecuencia portadora izquierda

            oscillatorRight = audioCtx.createOscillator();
            oscillatorRight.type = 'sine';
            oscillatorRight.frequency.value = 200 + freq; // frecuencia derecha

            oscillatorLeft.connect(gainNode);
            oscillatorRight.connect(gainNode);

            oscillatorLeft.start(now);
            oscillatorRight.start(now);
        }

        function updateBinaural(freq) {
            binauralFreq = freq;
            if (oscillatorLeft && oscillatorRight) {
                oscillatorLeft.frequency.value = 200;
                oscillatorRight.frequency.value = 200 + freq;
            }
        }

        function stopBinaural() {
            if (oscillatorLeft) {
                oscillatorLeft.stop();
                oscillatorLeft = null;
            }
            if (oscillatorRight) {
                oscillatorRight.stop();
                oscillatorRight = null;
            }
        }

        // ==================== VIBRACIÓN ====================
        function vibrateBeat(strength) {
            if (navigator.vibrate) {
                const duration = 80 + Math.floor(strength * 50);
                navigator.vibrate(duration);
            }
        }

        // ==================== LEY DE WINTER (EJEMPLO) ====================
        function winterLaw(heartRate, respRate, sessionTimeSec) {
            // Reemplaza con tu fórmula real
            if (sessionTimeSec < 120) return 10; // Alpha
            if (sessionTimeSec < 300) return 6;  // Theta
            return 3; // Delta
        }

        // ==================== DETECCIÓN DE LATIDOS ====================
        function processHeart(z, timestamp) {
            // Filtro pasa altos simple
            const heartAC = z - (HEART_ALPHA * prevHeartZ + (1 - HEART_ALPHA) * z);
            prevHeartZ = z;

            heartBuffer.push(heartAC);
            if (heartBuffer.length > HEART_BUFFER_SIZE) heartBuffer.shift();

            if (heartBuffer.length < 50) return null; // necesitamos suficientes datos

            // Calcular media y desviación
            const mean = heartBuffer.reduce((a, b) => a + b, 0) / heartBuffer.length;
            const std = Math.sqrt(heartBuffer.map(v => (v - mean) ** 2).reduce((a, b) => a + b, 0) / heartBuffer.length);
            const threshold = mean + 1.8 * std;

            if (heartAC > threshold) {
                const timeSinceLast = timestamp - lastBeatTime;
                if (timeSinceLast > MIN_BEAT_INTERVAL && lastBeatTime > 0) {
                    beatIntervals.push(timeSinceLast);
                    if (beatIntervals.length > 5) beatIntervals.shift();

                    const avgInterval = beatIntervals.reduce((a, b) => a + b, 0) / beatIntervals.length;
                    const bpm = Math.round(60000 / avgInterval);
                    const strength = Math.min(1, (heartAC - mean) / (3 * std));

                    lastBeatTime = timestamp;
                    return { bpm, strength, interval: timeSinceLast };
                }
                lastBeatTime = timestamp;
            }
            return null;
        }

        // ==================== DETECCIÓN DE RESPIRACIÓN ====================
        function processBreath(z, timestamp) {
            breathFiltered = BREATH_ALPHA * z + (1 - BREATH_ALPHA) * breathFiltered;

            // Detección de picos (inhalación)
            if (breathFiltered > 0.3) { // umbral arbitrario, se puede ajustar
                const timeSinceLast = timestamp - lastBreathPeak;
                if (timeSinceLast > 500 && lastBreathPeak > 0) {
                    const periodSec = timeSinceLast / 1000;
                    rpm = Math.round(60 / periodSec);
                }
                lastBreathPeak = timestamp;
            }
            return rpm;
        }

        // ==================== MANEJO DE SENSORES ====================
        function handleMotion(event) {
            if (!isPlaying) return;

            const accel = event.accelerationIncludingGravity;
            if (!accel) return;

            const z = accel.z || 0; // Eje perpendicular al pecho
            if (lastAccelZ === null) {
                lastAccelZ = z;
                return;
            }

            const timestamp = Date.now();
            const sessionTimeSec = (timestamp - sessionStartTime) / 1000;

            // Detectar latido
            const beat = processHeart(z, timestamp);
            if (beat) {
                bpmEl.textContent = beat.bpm;
                vibrateBeat(beat.strength);

                // Actualizar frecuencia binaural con Ley de Winter
                const newFreq = winterLaw(beat.bpm, rpm, sessionTimeSec);
                updateBinaural(newFreq);
                binauralEl.textContent = newFreq.toFixed(1);

                // Guardar en CSV
                csvData.push({
                    timestamp: new Date(timestamp).toISOString(),
                    heartRateBPM: beat.bpm,
                    rpm: rpm,
                    binauralFreq: newFreq,
                    accelZ: z.toFixed(3)
                });
            }

            // Detectar respiración
            const currentRPM = processBreath(z, timestamp);
            if (currentRPM > 0) {
                rpmEl.textContent = currentRPM;
            }

            lastAccelZ = z;
        }

        // ==================== INICIAR/DETENER SESIÓN ====================
        function startSession() {
            if (isPlaying) return;

            // Solicitar permiso para sensores de movimiento (iOS)
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            doStart();
                        } else {
                            alert('Permiso denegado');
                        }
                    })
                    .catch(console.error);
            } else {
                doStart();
            }
        }

        function doStart() {
            isPlaying = true;
            sessionStartTime = Date.now();
            playPauseBtn.textContent = '⏸';
            statusEl.textContent = 'Midiendo...';
            csvData = []; // limpiar datos anteriores

            // Iniciar audio
            initAudio();
            startBinaural(5); // frecuencia inicial
            binauralEl.textContent = '5.0';

            // Iniciar timer
            timerInterval = setInterval(() => {
                if (!isPlaying) return;
                const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 200);

            // Registrar evento de movimiento
            window.addEventListener('devicemotion', handleMotion);
        }

        function stopSession() {
            if (!isPlaying) return;
            isPlaying = false;
            playPauseBtn.textContent = '▶';
            statusEl.textContent = 'Sesión detenida';
            clearInterval(timerInterval);
            window.removeEventListener('devicemotion', handleMotion);
            stopBinaural();

            // Opcional: guardar CSV automáticamente al parar
        }

        // ==================== EXPORTAR CSV ====================
        function exportCSV() {
            if (csvData.length === 0) {
                alert('No hay datos para exportar');
                return;
            }

            let csvContent = csvHeaders.join(',') + '\n';
            csvData.forEach(row => {
                const line = [
                    row.timestamp,
                    row.heartRateBPM,
                    row.rpm,
                    row.binauralFreq,
                    row.accelZ
                ].join(',');
                csvContent += line + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `biofeedback_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ==================== EVENTOS ====================
        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopSession();
            } else {
                startSession();
            }
        });

        exportBtn.addEventListener('click', exportCSV);

        // Advertencia para iOS
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            statusEl.textContent = 'Toca PLAY y concede permiso';
        }

        // Desactivar scroll mientras se mide
        window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
